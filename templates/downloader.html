<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>برنامج تحميل فيديوهات يوتيوب</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap');
        body { font-family: 'Cairo', sans-serif; }
        .gradient-bg { background-color: #0f172a; }
    </style>
</head>
<body class="gradient-bg text-slate-200">
    <div class="min-h-screen flex flex-col items-center justify-center p-4">
        <div class="w-full max-w-2xl">
            <div class="text-center mb-8">
                <i class="fab fa-youtube text-red-500 text-6xl mb-4"></i>
                <h1 class="text-4xl font-bold text-white">برنامج تحميل فيديوهات يوتيوب</h1>
                <p class="text-slate-400 mt-2">تحميل ودمج تلقائي بأعلى جودة ممكنة.</p>
            </div>
            <form id="download-form" class="flex flex-col sm:flex-row items-center gap-2 mb-8">
                <input type="text" id="youtube-url" placeholder="لصق رابط يوتيوب هنا..." class="w-full bg-slate-800 border border-slate-700 rounded-lg p-4 text-lg text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <button type="submit" id="submit-btn" class="w-full sm:w-auto bg-blue-600 text-white font-bold py-4 px-8 rounded-lg hover:bg-blue-700 transition-colors"><span>تجهيز</span></button>
            </form>
            <div id="loader" class="text-center p-8 hidden">
                <i class="fa fa-spinner fa-spin text-4xl text-blue-500"></i>
                <p id="loader-text" class="mt-4">جاري التحميل والدمج على الخادم... <br> <span class="text-sm text-slate-400">قد تستغرق هذه العملية عدة دقائق، يرجى الانتظار.</span></p>
            </div>
            <div id="error" class="text-center p-8 hidden bg-red-900/50 border border-red-700 rounded-lg"></div>
            <div id="results" class="hidden bg-slate-800/50 border border-slate-700 rounded-lg p-6">
                <div class="flex flex-col sm:flex-row gap-6 items-center">
                    <img id="thumbnail" src="" class="w-full sm:w-48 rounded-lg">
                    <div class="flex-grow text-center sm:text-right">
                        <h2 id="video-title" class="text-xl font-bold text-white mb-4"></h2>
                        <p class="text-green-400 mb-4 font-bold">اكتمل التجهيز بنجاح!</p>
                        <a id="final-download-link" href="#" download class="w-full bg-green-600 text-white font-bold py-3 px-6 rounded-lg hover:bg-green-700 inline-flex items-center justify-center gap-2">
                            <i class="fa fa-download"></i>
                            <span>تحميل الآن</span>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script>
        const form = document.getElementById('download-form');
        const urlInput = document.getElementById('youtube-url');
        const loader = document.getElementById('loader');
        const errorDiv = document.getElementById('error');
        const resultsDiv = document.getElementById('results');
        const thumb = document.getElementById('thumbnail');
        const title = document.getElementById('video-title');
        const finalDownloadLink = document.getElementById('final-download-link');
        const submitBtn = document.getElementById('submit-btn');

        // The URL is now relative because the page is served from the same origin
        const BACKEND_URL = '/download';

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const youtubeUrl = urlInput.value.trim();
            if (!youtubeUrl) return;

            loader.classList.remove('hidden');
            resultsDiv.classList.add('hidden');
            errorDiv.classList.add('hidden');
            submitBtn.disabled = true;

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url: youtubeUrl }),
                });
                
                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.error || 'فشل الاتصال بالخادم.');
                }

                displayResults(data);

            } catch (err) {
                errorDiv.textContent = `حدث خطأ: ${err.message}`;
                errorDiv.classList.remove('hidden');
            } finally {
                loader.classList.add('hidden');
                submitBtn.disabled = false;
            }
        });

        function displayResults(data) {
            thumb.src = data.thumbnail;
            title.textContent = data.title;
            finalDownloadLink.href = data.download_url;
            finalDownloadLink.setAttribute('download', data.filename);
            resultsDiv.classList.remove('hidden');
        }
    </script>
</body>
</html>
